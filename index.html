<style>
  #calc-container { background: #0c1a2b; color: white; font-family: sans-serif; text-align: center; direction: rtl; padding: 25px; border: 1px solid #d4af37; border-radius: 20px; max-width: 420px; margin: auto; box-shadow: 0 10px 30px #000; }
  .group-name { color: #d4af37; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
  .market-tag { color: #a0aec0; font-size: 17px; margin-bottom: 20px; border-bottom: 1px solid #2d3748; padding-bottom: 10px; font-weight: bold; display: block; }
  .field { margin-bottom: 15px; text-align: right; }
  label { display: block; font-size: 14px; color: #9fb3c8; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #1d3550; background: #081521; color: white; text-align: right; box-sizing: border-box; font-size: 16px; outline: none; }
  .action-btn { width: 100%; padding: 18px; background: linear-gradient(90deg, #d4af37, #f1d06b); border: none; border-radius: 12px; color: #0c1a2b; font-size: 19px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .output { display: none; margin-top: 25px; border-top: 1px solid rgba(212,175,55,0.3); padding-top: 20px; text-align: right; }
  .res-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px; }
  .gold { font-weight: bold; color: #d4af37; }
  .highlight-box { background: rgba(212,175,55,0.1); padding: 12px; border-radius: 10px; border-right: 5px solid #ff4d4d; margin: 10px 0; }
  .net-yield-box { background: rgba(0,210,122,0.1); padding: 12px; border-radius: 10px; border-right: 5px solid #00d27a; margin: 10px 0; }
  .signature { text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px dotted #d4af37; color: #d4af37; font-weight: bold; font-size: 16px; letter-spacing: 1px; }
</style>

<div id="calc-container">
  <div class="group-name">جروب عملاء البنوك المصرية</div>
  <span class="market-tag">أذون خزانة - سوق أولى</span>
  
  <div class="field">
    <label>مبلغ دخول المزاد (جنيه)</label>
    <input type="number" id="v_amt" placeholder="مثال: 100000">
  </div>
  
  <div class="field">
    <label>متوسط سعر العائد المرجح (%)</label>
    <input type="number" step="0.001" id="v_rate" placeholder="مثال: 28.255">
  </div>
  
  <div class="field">
    <label>مدة الأذون بالأيام</label>
    <select id="v_days">
      <option value="91">91 يوم</option>
      <option value="182">182 يوم</option>
      <option value="273">273 يوم</option>
      <option value="364">364 يوم</option>
    </select>
  </div>
  
  <button class="action-btn" onclick="execute()">أضغط هنا لظهور النتائج ✨</button>
  
  <div id="v_res" class="output">
    <div class="res-line"><span>مبلغ الترسية:</span><span class="gold" id="o_p"></span></div>
    <div class="highlight-box">
      <div style="font-size:13px; color:white; margin-bottom:5px;">العائد لحسابك يوم الإصدار:</div>
      <div class="gold" id="o_c" style="color:#ff4d4d; font-size:22px;"></div>
    </div>
    <div class="res-line"><span>قيمة الضريبة (20%):</span><span class="gold" id="o_t"></span></div>
    <div class="res-line"><span>صافي الربح النهائي:</span><span class="gold" id="o_n" style="color:#00d27a;"></span></div>
    
    <div class="net-yield-box">
      <div style="font-size:13px; color:white; margin-bottom:5px;">نسبة العائد السنوي الصافي:</div>
      <div class="gold" id="o_y" style="color:#00d27a; font-size:20px;"></div>
    </div>
    
    <div class="signature">Analyst: Tarek Metwally</div>
  </div>
</div>

<script>
function execute(){
  var a = parseFloat(document.getElementById('v_amt').value);
  var r = parseFloat(document.getElementById('v_rate').value)/100;
  var d = parseInt(document.getElementById('v_days').value);
  if(a && r){
    var p = a/(1+(r*d/365)), cb = a-p, tx = cb*0.2, nt = cb-tx;
    // معادلة العائد السنوي الصافي بصدق وأمانة
    var ny = (nt / p) * (365 / d) * 100;

    document.getElementById('o_p').innerText = p.toLocaleString('ar-EG', {maximumFractionDigits:2}) + " ج";
    document.getElementById('o_c').innerText = cb.toLocaleString('ar-EG', {maximumFractionDigits:2}) + " ج";
    document.getElementById('o_t').innerText = tx.toLocaleString('ar-EG', {maximumFractionDigits:2}) + " ج";
    document.getElementById('o_n').innerText = nt.toLocaleString('ar-EG', {maximumFractionDigits:2}) + " ج";
    document.getElementById('o_y').innerText = ny.toFixed(3) + " %";
    document.getElementById('v_res').style.display = 'block';
  }
}
</script>
